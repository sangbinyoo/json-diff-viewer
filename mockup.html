<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JSON Comparator — Mockup</title>
  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
      background: #f0f0ee;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 20px;
    }

    /* ── 페이지 카드 ── */
    .page {
      background: #fff;
      border-radius: 12px;
      border: 1px solid rgba(0,0,0,0.10);
      padding: 28px 24px;
      width: 100%;
      max-width: 760px;
    }

    /* ── 제목 ── */
    .title {
      font-size: 22px;
      font-weight: 500;
      color: #1a1a18;
      margin-bottom: 18px;
    }

    /* ── 툴바 ── */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    /* Upload files 버튼 */
    .btn-upload {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 34px;
      padding: 0 14px;
      border: 1.5px dashed rgba(0,0,0,0.25);
      border-radius: 8px;
      background: #f7f7f6;
      color: #6b6b65;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.14s;
    }
    .btn-upload:hover { background: #eeeeed; }
    .btn-upload svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; }

    /* ② Compare 버튼 */
    .btn-compare {
      height: 34px;
      padding: 0 18px;
      border: none;
      border-radius: 8px;
      background: #1D9E75;
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.14s;
    }
    .btn-compare:hover { opacity: 0.88; }
    .btn-compare:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ⑤ Sort */
    .sort-group {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .sort-label { font-size: 13px; color: #6b6b65; }
    .sort-select {
      height: 28px;
      padding: 0 8px;
      border-radius: 8px;
      border: 1px solid rgba(0,0,0,0.15);
      background: #fff;
      color: #1a1a18;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
    }

    /* ⑥ Export 버튼 */
    .btn-export {
      margin-left: auto;
      height: 34px;
      padding: 0 18px;
      border: none;
      border-radius: 8px;
      background: #185FA5;
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.14s;
    }
    .btn-export:hover { opacity: 0.88; }

    /* ── 메인 그리드 ── */
    .main {
      display: grid;
      grid-template-columns: 145px 145px 1fr;
      gap: 14px;
      align-items: start;
    }

    /* ③④ 파일 패널 */
    .file-panel { display: flex; flex-direction: column; gap: 6px; }
    .file-label { font-size: 12px; color: #6b6b65; padding-left: 2px; }

    .file-box {
      background: #f7f7f6;
      border: 1px solid rgba(0,0,0,0.09);
      border-radius: 10px;
      min-height: 280px;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      padding: 10px;
    }

    /* ⑦ 결과 패널 */
    .result-panel { display: flex; flex-direction: column; gap: 8px; }

    .result-header {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #6b6b65;
    }

    .result-box {
      background: #f7f7f6;
      border: 1px solid rgba(0,0,0,0.09);
      border-radius: 10px;
      padding: 14px 12px;
      min-height: 280px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .prop-label {
      font-size: 12px;
      color: #6b6b65;
      padding: 0 2px;
      margin-bottom: 4px;
    }

    /* ── 트리 행 ── */
    .tree-row {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 2px 0;
    }

    .indent { padding-left: 22px; }

    .toggle {
      font-size: 10px;
      color: #6b6b65;
      min-width: 12px;
      user-select: none;
    }

    /* ── 칩 (프로퍼티 레이블) ── */
    .chip {
      display: inline-flex;
      align-items: center;
      height: 26px;
      padding: 0 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      cursor: default;
      white-space: nowrap;
    }

    /* 변경 (노랑) */
    .chip-changed  { background: #FAEEDA; color: #854F0B; }
    /* 삭제 (빨강) */
    .chip-removed  { background: #FCEBEB; color: #A32D2D; }
    /* 추가 (초록) */
    .chip-added    { background: #EAF3DE; color: #3B6D11; }
    /* 동일 (회색) */
    .chip-unchanged { background: #f0f0ee; color: #6b6b65; }

    /* ── 반응형 ── */
    @media (max-width: 600px) {
      .main { grid-template-columns: 1fr 1fr; }
      .result-panel { grid-column: 1 / -1; }
      .btn-export { margin-left: 0; }
    }
  </style>
</head>
<body>

<div class="page">

  <!-- 제목 -->
  <h1 class="title">JSON Comparator</h1>

  <!-- 툴바 -->
  <div class="toolbar" role="toolbar" aria-label="메인 도구모음">

    <!-- Upload files -->
    <button class="btn-upload" aria-label="JSON 파일 업로드">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      Upload files
    </button>

    <!-- Compare -->
    <button class="btn-compare">Compare</button>

    <!-- Sort -->
    <div class="sort-group">
      <span class="sort-label">Sort</span>
      <select class="sort-select" aria-label="정렬 기준 선택">
        <option value="key">key</option>
        <option value="type">type</option>
        <option value="original">original</option>
      </select>
    </div>

    <!-- Export -->
    <button class="btn-export">Export</button>

  </div><!-- /toolbar -->

  <!-- 메인 그리드 -->
  <main class="main">

    <!-- origin file -->
    <section class="file-panel" aria-label="원본 파일">
      <span class="file-label">origin file</span>
      <div class="file-box"></div>
    </section>

    <!-- target file -->
    <section class="file-panel" aria-label="비교 대상 파일">
      <span class="file-label">target file</span>
      <div class="file-box"></div>
    </section>

    <!-- Compare result -->
    <section class="result-panel" aria-label="비교 결과">
      <div class="result-header">Compare result</div>

      <div class="result-box" role="tree" aria-label="프로퍼티 트리">
        <p class="prop-label">property</p>

        <!-- name: changed -->
        <div class="tree-row" role="treeitem">
          <span class="toggle"></span>
          <span class="chip chip-changed" title="변경됨">name</span>
        </div>

        <!-- birthday: removed -->
        <div class="tree-row" role="treeitem">
          <span class="toggle"></span>
          <span class="chip chip-removed" title="삭제됨">birthday</span>
        </div>

        <!-- age: 부모 객체 (자식 있음) -->
        <div class="tree-row" role="treeitem" aria-expanded="true">
          <span class="toggle">▾</span>
          <span class="chip chip-added" title="하위 항목 있음">age</span>
        </div>

        <!-- age.props -->
        <div class="tree-row indent" role="treeitem">
          <span class="toggle"></span>
          <span class="chip chip-added" title="추가됨">props</span>
        </div>

        <!-- age.props2 -->
        <div class="tree-row indent" role="treeitem">
          <span class="toggle"></span>
          <span class="chip chip-added" title="추가됨">props2</span>
        </div>

        <!-- age.month -->
        <div class="tree-row indent" role="treeitem">
          <span class="toggle"></span>
          <span class="chip chip-added" title="추가됨">month</span>
        </div>

      </div><!-- /result-box -->
    </section>

  </main>

</div><!-- /page -->

</body>
</html>
